---
layout: default
---
<section class="hero" style="padding: 90px 0 60px;">
  <div class="wrap">
    <div class="hero-content">
      {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</section>
